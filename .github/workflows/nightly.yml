name: Regression Tests

on:
  schedule:
    - cron: '13 2 * * *' # every day at 02:13 UTC
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to filter tests'
        required: false
        type: string
        default: 'not @known-issue'

permissions:
  contents: read

jobs:
  regression-test:
    uses: ./.github/workflows/run-tests.yml
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
    with:
      browser: ${{ matrix.browser }}
      tags: ${{ github.event.inputs.tags || 'not @known-issue' }}
      suite: 'regression'

  known-issues:
    uses: ./.github/workflows/run-tests.yml
    with:
      browser: 'chrome'
      tags: '@known-issue'
      suite: 'known-issues'
      expected_failures: true