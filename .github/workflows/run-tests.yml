name: Run tests

on:
  workflow_call:
    inputs:
      tags:
        description: 'Cucumber tags to filter tests'
        required: true
        type: string
      browser:
        description: 'Browser to run tests on'
        required: false
        type: string
        default: chrome
      suite:
        description: 'Test suite name'
        required: true
        type: string
      expected_failures:
        description: 'Expect failures for the test suite'
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tests
        uses: actions/checkout@v4
      - name: Check out Conduit App
        uses: actions/checkout@v4
        with:
          repository: bbankita/conduit-realworld-example-app
          path: conduit
      - name: Start Conduit
        working-directory: conduit
        run: docker compose up -d --build --wait
      - name: Wait for seed data
        working-directory: conduit
        run: docker compose wait seed
      - name: Smoke check Conduit
        run: curl --fail --silent --show-error http://localhost:3001/api/articles?limit=1
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run tests
        env:
          BROWSER: ${{ inputs.browser }}
          TAGS: ${{ inputs.tags }}
        run: mvn -B clean test -Dheadless=true -Dbrowser="${BROWSER}" -Dcucumber.filter.tags="${TAGS}"
        continue-on-error: ${{ inputs.expected_failures }}
      - name: Check for expected failures
        if: ${{ inputs.expected_failures }}
        run: |
          python3 .github/scripts/check_known_issues.py target/cucumber-report/cucumber.json
      - name: Generate report
        if: always()
        run: mvn -B cluecumber:reporting
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ inputs.suite}}-${{ inputs.browser }}
          path: |
            target/generated-report/
            target/cucumber-html/
            target/framework.log
      - name: Conduit logs
        if: failure()
        working-directory: conduit
        run: docker compose logs app